[project]
name = "xinhuo"
version = "0.1.0"
description = "薪火：跨 Agent 共享的经验记忆库 MCP 服务（本地 markdown + git + SQLite FTS5）"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "pyyaml>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["xinhuo"]

[project.scripts]
xinhuo = "xinhuo.__main__:main"
