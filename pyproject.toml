[project]
name = "knowbase"
version = "0.2.0rc9"
description = "薪火：跨 Agent 共享的经验记忆库 MCP 服务（本地 markdown + git + SQLite FTS5）"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2,<2",
  "pyyaml>=6.0",
  "packaging>=23",  # standalone updater version and dependency compatibility gates
  "tomli>=2; python_version < '3.11'",
  # 原地多格式摄取（PDF/DOCX/XLSX/PPTX/OCR）
  "pypdf>=5.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
  "pillow>=10.0",        # P5-A3 OCR 解析图片字节
  "pytesseract>=0.3",    # OCR Python 包装（tesseract 二进制仍需手动安装）
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]

[tool.knowbase.updates]
protocol = 1

[tool.setuptools.packages.find]
include = ["knowbase*"]

[tool.setuptools.package-data]
knowbase = ["data/*.json"]

[project.scripts]
knowbase = "knowbase.__main__:main"
